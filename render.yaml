services:
  - type: web
    name: freshsource-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        scope: build,runtime
        sync: false
      - key: WHATSAPP_TOKEN
        scope: runtime
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        scope: runtime
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        scope: runtime
        sync: false
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: CORS_ORIGINS
        value: "https://freshsource.onrender.com,https://your-frontend-domain.com"
      - key: LOG_LEVEL
        value: "INFO"
      - key: OPENAI_API_KEY
        scope: runtime
        sync: false
      - key: OLLAMA_ENABLED
        value: "false"